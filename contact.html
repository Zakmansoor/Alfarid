<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> وكالة الفريد  تواصل معنا</title>
            <link rel="icon" type="image/png" href="img/favicon1.png ">        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="" name="keywords">
<meta name="description" content="
    وكالة الفريد - وكالة سفريات وسياحة رائدة في اليمن منذ عام 2000. 
    نقدم خدمات متكاملة تشمل: تأشيرات العمل الحرة والفردية للسعودية ودول الخليج، 
    حجز تذاكر الطيران والباص، استخراج وتجديد الجوازات والوثائق الرسمية، 
    معاملات الإقامة والتأشيرات، خدمات العمرة والحج، والموافقات الأمنية.
    نضمن لكم خدمات سريعة وآمنة بأسعار تنافسية.
">    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap');
        
        :root {
            --primary-color: #c9a96e; /* ذهبي فاتح */
            --secondary-color: #1a365d; /* أزرق داكن */
            --accent-color: #e8c872; /* ذهبي مشع */
            --light-bg: #f8f5f0; /* خلفية فاتحة */
            --whatsapp-color: #25D366;
            --facebook-color: #3b5998;
            --instagram-color: #E1306C;
            --phone-color: #34b834;
            --title-font: 'Almarai', sans-serif;
            --text-font: 'Tajawal', sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a365d 0%, #2d4a7c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            font-family: var(--text-font);
            overflow-x: hidden;
        }
        
       body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('img/backgraoun.png'); /* تم تصحيح كتابة الكلمة */
    background-size: 120% 120%; /* تكبير الخلفية قليلاً */
    background-position: 0% 0%; /* الموضع الابتدائي */
    z-index: 0;
    animation: animateBackground 10s ease-in-out infinite;
}

@keyframes animateBackground {
    0% {
        background-position: 0% 0%;
    }
    50% {
        background-position: 100% 100%;
    }
    100% {
        background-position: 0% 0%;
    }
}
        .page-container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 1s ease-out;
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            padding: 35px 25px;
            text-align: center;
            background: linear-gradient(135deg, var(--secondary-color) 0%, #2d4a7c 100%);
            color: white;
            border-bottom: 3px solid var(--primary-color);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(201, 169, 110, 0.1) 0%, transparent 70%);
            animation: pulse 8s infinite linear;
        }
        
        @keyframes pulse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--primary-color);
            box-shadow: 0 5px 20px rgba(201, 169, 110, 0.5);
            position: relative;
            z-index: 2;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .company-name {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            font-family: var(--title-font);
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            background: linear-gradient(to right, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 5px rgba(201, 169, 110, 0.5); }
            to { text-shadow: 0 0 15px rgba(201, 169, 110, 0.8), 0 0 20px rgba(201, 169, 110, 0.6); }
        }
        
        .company-slogan {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .contact-list {
            padding: 35px 25px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            background: linear-gradient(135deg, white 0%, #f8f5f0 100%);
            box-shadow: 0 8px 20px rgba(26, 54, 93, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 1px solid rgba(201, 169, 110, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .contact-item::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 169, 110, 0.1));
            transition: width 0.5s ease;
        }
        
        .contact-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(26, 54, 93, 0.25);
        }
        
        .contact-item:hover::before {
            width: 100%;
        }
        
        .contact-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.7rem;
            color: white;
            margin-left: 18px;
            flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }
        
        .contact-item:hover .contact-icon {
            transform: rotate(15deg) scale(1.1);
        }
        
        .contact-info {
            flex-grow: 1;
            position: relative;
            z-index: 2;
        }
        
        .contact-title {
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 5px;
            font-size: 1.3rem;
            font-family: var(--title-font);
            transition: all 0.3s ease;
        }
        
        .contact-item:hover .contact-title {
            color: var(--primary-color);
        }
        
        .contact-desc {
            font-size: 0.95rem;
            color: #666;
            letter-spacing: 0.3px;
        }
        
        .whatsapp .contact-icon { 
            background: var(--whatsapp-color); 
        }
        .facebook .contact-icon { 
            background: var(--facebook-color); 
        }
        .instagram .contact-icon { 
            background: var(--instagram-color); 
        }
        .phone .contact-icon { 
            background: var(--phone-color); 
        }
        
        .footer {
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, #2d4a7c 100%);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(201, 169, 110, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
        }
        
        .footer p {
            font-weight: 500;
            position: relative;
            z-index: 2;
        }
        
        /* تأثيرات إضافية */
        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .floating-element {
            position: absolute;
            background: rgba(201, 169, 110, 0.1);
            border-radius: 50%;
            animation: floatAround 15s infinite linear;
        }
        
        @keyframes floatAround {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, 15px) rotate(90deg); }
            50% { transform: translate(20px, 5px) rotate(180deg); }
            75% { transform: translate(10px, -10px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            .company-name {
                font-size: 1.8rem;
            }
            
            .contact-item {
                padding: 15px;
            }
            
            .contact-icon {
                width: 55px;
                height: 55px;
                font-size: 1.5rem;
            }
            
            .contact-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- عناصر عائمة للخلفية -->
    <div class="floating-elements">
        <div class="floating-element" style="width: 80px; height: 80px; top: 10%; left: 10%; animation-delay: 0s;"></div>
        <div class="floating-element" style="width: 60px; height: 60px; top: 70%; left: 80%; animation-delay: -5s;"></div>
        <div class="floating-element" style="width: 100px; height: 100px; top: 40%; left: 60%; animation-delay: -10s;"></div>
        <div class="floating-element" style="width: 40px; height: 40px; top: 20%; left: 70%; animation-delay: -2s;"></div>
    </div>
    
    <div class="page-container">
        <div class="header">
            <div class="logo">
                <!-- هنا يمكنك إضافة شعار الوكالة -->
                <img src="img/favicon1.png" alt="شعار وكالة الفريد">
            </div>
            <h1 class="company-name">وكالة الفريد للسفريات</h1>
            <p class="company-slogan">للسفريات والسياحة وخدمات الحج والعمرة</p>
        </div>
        
        <div class="contact-list">
            <!-- واتساب -->
            <div class="contact-item whatsapp" onclick="window.open('https://wa.me/message/7OL2SOMWEJWYK1')">
                <div class="contact-icon">
                    <i class="fab fa-whatsapp"></i>
                </div>
                <div class="contact-info">
                    <div class="contact-title">واتساب</div>
                    <div class="contact-desc">تواصل معنا عبر الواتساب</div>
                </div>
            </div>
            
            <!-- فيسبوك -->
            <div class="contact-item facebook" onclick="window.open('https://www.facebook.com/share/162Wq3EMyW/')">
                <div class="contact-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="contact-info">
                    <div class="contact-title">فيسبوك</div>
                    <div class="contact-desc">تابعنا على فيسبوك</div>
                </div>
            </div>
            
            <!-- إنستجرام -->
            <div class="contact-item instagram" onclick="window.open('https://www.instagram.com/alfred_for_jobs?igsh=cmNqcWxzNThuaTc0')">
                <div class="contact-icon">
                    <i class="fab fa-instagram"></i>
                </div>
                <div class="contact-info">
                    <div class="contact-title">إنستجرام</div>
                    <div class="contact-desc">تابعنا على إنستجرام</div>
                </div>
            </div>
            
            <!-- هاتف -->
            <div class="contact-item phone" onclick="window.location.href='tel:‎+967 775 266 242'">
                <div class="contact-icon">
                    <i class="fas fa-phone-alt"></i>
                </div>
                <div class="contact-info">
                    <div class="contact-title">اتصل بنا</div>
                    <div class="contact-desc">242 266 775 967+</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>25 عام من التميز والابداع</p>
        </div>
    </div>

    <script>
        // إضافة تأثيرات تفاعلية إضافية
        document.addEventListener('DOMContentLoaded', function() {
            const contactItems = document.querySelectorAll('.contact-item');
            
            contactItems.forEach(item => {
                item.addEventListener('mouseenter', function() {
                    this.style.zIndex = '10';
                });
                
                item.addEventListener('mouseleave', function() {
                    this.style.zIndex = '1';
                });
            });
        });
    </script>
</body>
</html>
